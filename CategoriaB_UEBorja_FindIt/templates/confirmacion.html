{% extends "base.html" %}
{% block contenido %}
<div class="tarjeta formulario" style="text-align:center;margin-top:40px">
  <div style="font-size:56px;color:{{ 'var(--verde)' if exito else 'var(--error)' }}">{{ '✔' if exito else '✕' }}</div>
  <h1>{{ titulo }}</h1><p class="sub">{{ detalle }}</p>
  <div class="acciones" style="justify-content:center">
    {% if not exito and objeto_id %}<a class="boton sec" href="{{ url_for('detalle', objeto_id=objeto_id) }}">Volver al detalle</a>{% endif %}
    <a class="boton" href="{{ url_for('listado') }}">Volver al listado</a>
  </div>
</div>
{% endblock %}
