{% extends "base.html" %}
{% block contenido %}
<a class="volver" href="{{ url_for('panel') }}">← Volver al panel</a>
<h1>Opciones</h1>
{% if aviso %}<p class="aviso {% if error %}error{% endif %}">{{ aviso }}</p>{% endif %}
<div>
  <form class="tarjeta formulario" method="post" style="margin:0">
    <h2>Mis credenciales</h2>
    <p class="sub">Por seguridad, escribe tu contraseña actual. Deja la nueva en blanco si no quieres cambiarla.</p>
    <div class="campos">
      <div class="campo"><label>Tu nombre</label><input name="nombre" value="{{ nombre }}"></div>
      <div class="campo"><label>Usuario</label><input name="usuario" value="{{ usuario_admin }}"></div>
      <div class="campo ancho"><label>Contraseña actual <span class="ob">*</span></label><input type="password" name="actual"></div>
      <div class="campo"><label>Contraseña nueva (mín. 6)</label><input type="password" name="nueva"></div>
      <div class="campo"><label>Repite la contraseña nueva</label><input type="password" name="confirmar"></div>
    </div>
    <div class="acciones"><button class="boton">Guardar cambios</button></div>
  </form>
</div>
{% endblock %}
